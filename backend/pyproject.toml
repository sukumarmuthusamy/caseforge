[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caseforge"
version = "0.1.0"
description = "An interactive multi-agent investigation and reasoning laboratory."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
caseforge = "caseforge.__main__:main"

[tool.setuptools.packages.find]
include = ["caseforge*"]

[tool.setuptools.package-data]
caseforge = ["scenarios/*.json", "challenges/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
